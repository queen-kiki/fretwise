[package]
name = "fretwise-app"
description = "Standalone Fretwise: cpal audio input + eframe window"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fretwise"
path = "src/main.rs"

[features]
default = ["asio"]
# Native ASIO on Windows (a no-op elsewhere). Needs LLVM (libclang) and the
# Steinberg ASIO SDK; set CPAL_ASIO_DIR to the SDK folder or cpal's build
# script downloads it. Build with --no-default-features to go without.
asio = ["cpal/asio"]

[dependencies]
fretwise-core.workspace = true
fretwise-ui.workspace = true
eframe.workspace = true
egui.workspace = true
cpal.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

[build-dependencies]
winresource = "0.1"
