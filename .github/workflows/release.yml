# Builds Fretwise for Windows, Linux and macOS and publishes them as a GitHub
# Release whenever a version tag is pushed. Bump the workspace version in
# Cargo.toml first (the app shows it), commit, then:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Running it by hand from the Actions tab builds everything without
# publishing, for checking the builds still work.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          # The oldest supported runner, so the binary runs on older glibc.
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # With native ASIO: the runner ships LLVM for asio-sys's bindgen, and
      # cpal's build script downloads the Steinberg ASIO SDK.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --release --locked -p fretwise-app --features asio
          mkdir dist
          cp target/release/fretwise.exe dist/fretwise-${{ matrix.name }}.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p fretwise-app
          mkdir dist
          tar -czf dist/fretwise-${{ matrix.name }}.tar.gz -C target/release fretwise

      # A universal .app bundle. The Info.plist's microphone description is
      # required: without it macOS silently denies audio input. The app is
      # only ad-hoc signed, not notarized, so first launch needs right-click
      # > Open.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p fretwise-app --target aarch64-apple-darwin
          cargo build --release --locked -p fretwise-app --target x86_64-apple-darwin
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)

          app=dist/Fretwise.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/fretwise" \
            target/aarch64-apple-darwin/release/fretwise \
            target/x86_64-apple-darwin/release/fretwise

          iconset=$RUNNER_TEMP/fretwise.iconset
          mkdir "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo/fretwise-logo-512.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            if [ $double -le 512 ]; then
              sips -z $double $double assets/logo/fretwise-logo-512.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/fretwise.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Fretwise</string>
            <key>CFBundleDisplayName</key><string>Fretwise</string>
            <key>CFBundleIdentifier</key><string>io.github.queen-kiki.fretwise</string>
            <key>CFBundleExecutable</key><string>fretwise</string>
            <key>CFBundleIconFile</key><string>fretwise</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Fretwise listens to your guitar to check the notes you play.</string>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" dist/fretwise-${{ matrix.name }}.zip
          rm -rf "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: fretwise-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fretwise ${GITHUB_REF_NAME#v}" \
            --generate-notes
